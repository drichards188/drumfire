<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crew motion study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #d6d8d5; color: #25312e; font: 13px system-ui, sans-serif; }
    header { height: 58px; display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: #f3f2eb; }
    header strong { margin-right: auto; }
    label { display: flex; align-items: center; gap: 6px; }
    select, button { color: inherit; font: inherit; padding: 5px 8px; }
    #stage { position: relative; height: calc(100vh - 58px); }
    canvas { display: block; width: 100%; height: 100%; }
    #labels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
    #labels span { padding: 12px 18px; border: 1px solid #ffffff60; }
    #labels.single { display: block; }
  </style>
</head>
<body>
  <header>
    <strong>Crew motion study</strong>
    <label>Pose <select id="pose"></select></label>
    <label>View <select id="view"><option value="three">Three quarter</option><option value="side">Side</option><option value="front">Front</option></select></label>
    <label><input type="checkbox" id="sequence" checked>Sequence</label>
    <label><input type="checkbox" id="rig">Joints</label>
    <button id="play">Play</button>
    <input type="range" id="phase" min="0" max="1" step="0.001" value="0">
  </header>
  <div id="stage"><div id="labels"></div></div>
  <script type="module" src="./crew_motion.js"></script>
</body>
</html>
